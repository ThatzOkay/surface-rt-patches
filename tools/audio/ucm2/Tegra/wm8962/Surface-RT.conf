# Use case configuration for the Microsoft Surface RT (WM8962 codec, Tegra30).
#
# Without a profile PipeWire falls back to "stereo-fallback", whose only capture port is the headset jack
# (`analog-input-mic`, "not available" when nothing is plugged in), so the built-in microphone shows as
# "unplugged" or is hidden. This profile describes the real hardware: a PDM stereo microphone on the codec's
# GPIO2/GPIO5 (kernel patch 0030), reached by setting `Input Mode` to Digital; speakers; headphones.

Syntax 4

BootSequence [
	# playback: the hardware speaker volume starts about -25 dB below comfortable (docs/audio.md)
	cset "name='Speaker Volume' 110,110"
	cset "name='Speaker Switch' on,on"
	cset "name='Int Spk Switch' on"

	# capture: the digital (microphone) gain is the one that matters in Digital mode
	cset "name='Capture Switch' on,on"
	cset "name='Digital Capture Volume' 127,127"
	cset "name='Input Mode' Digital"
]

SectionUseCase."HiFi" {
	File "/Tegra/wm8962/Surface-RT-HiFi.conf"
	Comment "Play and record HiFi quality audio"
}
