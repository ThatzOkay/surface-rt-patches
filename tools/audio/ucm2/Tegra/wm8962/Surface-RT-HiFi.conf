# HiFi use case for the Microsoft Surface RT (WM8962). Control names were checked against the card's
# `amixer -c 1 controls` on 2026-11-05.

# Priorities: the jack devices (Headphones, Headset) rank ABOVE the always-present ones (Speaker, Mic). A device
# whose JackControl reads off is "not available" and loses; one that reads on wins. If the jack devices ranked
# below, "unknown"-availability Speaker/Mic would win even with a plug inserted.

SectionDevice."Speaker" {
	Comment "Speakers"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Speaker Switch' on,on"
		cset "name='Int Spk Switch' on"
	]

	DisableSequence [
		cset "name='Int Spk Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	# UNTESTED: only the speaker path has been listened to on this device (docs/audio.md). These are the
	# DAC -> headphone mixer -> HPOUT controls the codec exposes.
	EnableSequence [
		cset "name='Headphones Switch' on"
		cset "name='HPMIXL DACL Switch' on"
		cset "name='HPMIXR DACR Switch' on"
		cset "name='Headphone Mixer Switch' on,on"
		cset "name='Headphone Switch' on,on"
		cset "name='Headphone Volume' 100,100"
	]

	DisableSequence [
		cset "name='Headphone Switch' off,off"
		cset "name='Headphone Mixer Switch' off,off"
		cset "name='HPMIXL DACL Switch' off"
		cset "name='HPMIXR DACR Switch' off"
		cset "name='Headphones Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone"

	ConflictingDevice [
		"Headset"
	]

	# The two on-board PDM microphones: the codec's digital input path. Always present (no JackControl),
	# so it is never reported as "unplugged".
	EnableSequence [
		cset "name='Input Mode' Digital"
		cset "name='Int Mic Switch' on"
		cset "name='Internal Mic 1 Switch' on"
		cset "name='Internal Mic 2 Switch' on"
		cset "name='Capture Switch' on,on"
	]

	DisableSequence [
		cset "name='Int Mic Switch' off"
	]

	Value {
		CapturePCM "hw:${CardId}"
		CaptureChannels 2
		CapturePriority 100
		CaptureMixerElem "Digital Capture"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	# UNTESTED: the 3.5 mm jack's analog microphone input (INPGA/MIXIN, Input Mode Analog). It only
	# appears while the jack reports a microphone (Mic Jack).
	EnableSequence [
		cset "name='Input Mode' Analog"
		cset "name='Mic Jack Switch' on"
		cset "name='Headset Mic Switch' on"
		cset "name='Capture Switch' on,on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Jack Switch' off"
		cset "name='Input Mode' Digital"
	]

	Value {
		CapturePCM "hw:${CardId}"
		CaptureChannels 2
		CapturePriority 200
		CaptureMixerElem "Capture"
		JackControl "Mic Jack"
	}
}
