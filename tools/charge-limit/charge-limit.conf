# /etc/charge-limit.conf - read by /usr/local/sbin/charge-limit every cycle
# MODE: limit = keep START..STOP %, hold = no charging while plugged in (battery idle),
#       full = charge to 100 %. Switch with: sudo charge-limit limit|hold|full
MODE=limit
ENABLED=1
START=75
STOP=80
FLOOR=20
INTERVAL=60
